<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Item Detail Lab</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1017;--surface:#10121a;--card:#161b26;--accent:#f0883e;--accentSoft:rgba(240,136,62,0.10);--shelf:#e8c364;--shelfSoft:rgba(232,195,100,0.06);--shelfBorder:rgba(232,195,100,0.15);--text:#e6e8ee;--soft:#8b92a8;--muted:#555d74;--border:rgba(255,255,255,0.06);--borderL:rgba(255,255,255,0.10);--green:#3dd68c;--red:#ff5c5c;--blue:#6c8aff;--purple:#c76dff;--cyan:#34d6c0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
.app{display:flex;gap:24px;max-width:1200px;margin:0 auto;padding:24px 16px;align-items:flex-start}
@media(max-width:900px){.app{flex-direction:column;align-items:center}}
.controls{flex:1;max-width:500px;position:sticky;top:24px}
.controls h1{font-size:22px;font-weight:800;margin-bottom:4px;background:linear-gradient(135deg,var(--text),var(--shelf));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.controls .sub{font-size:12px;color:var(--muted);margin-bottom:20px}
.ctrl-section{margin-bottom:16px;background:var(--surface);border-radius:14px;padding:14px;border:1px solid var(--border)}
.ctrl-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px}
.ctrl-label .cl-icon{font-size:16px}
.ctrl-label .cl-active{margin-left:auto;font-size:10px;color:var(--accent);font-weight:600;background:var(--accentSoft);padding:2px 8px;border-radius:6px}
.ctrl-grid{display:flex;gap:4px;flex-wrap:wrap}
.ctrl-btn{width:40px;height:34px;border-radius:8px;border:1.5px solid var(--borderL);background:var(--card);color:var(--soft);font-size:12px;font-weight:700;cursor:pointer;transition:all 0.15s;font-family:inherit;display:flex;align-items:center;justify-content:center}
.ctrl-btn:hover{border-color:var(--muted);background:rgba(255,255,255,0.04)}
.ctrl-btn.active{border-color:var(--accent);background:var(--accentSoft);color:var(--accent)}
.ctrl-desc{font-size:10px;color:var(--muted);margin-top:6px;min-height:14px}
.phone-wrap{flex-shrink:0;position:sticky;top:24px}
.phone{width:360px;height:700px;background:var(--bg);border-radius:28px;border:2px solid var(--borderL);overflow:hidden;position:relative;box-shadow:0 16px 48px rgba(0,0,0,0.5);display:flex}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:90px;height:5px;background:var(--borderL);border-radius:0 0 8px 8px;z-index:20}
.tabs{width:42px;background:var(--surface);display:flex;flex-direction:column;gap:2px;padding:32px 3px 10px;border-right:1px solid var(--border);flex-shrink:0}
.tab{width:36px;height:38px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;position:relative}
.tab:hover{background:rgba(255,255,255,0.04)}
.tab.active{background:var(--card);border:1px solid var(--borderL)}
.tab.active::after{content:'';position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:3px;height:12px;background:var(--accent);border-radius:2px}
.tab-spacer{flex:1}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--bg)}
.content-close{position:absolute;top:8px;right:10px;width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,0.05);border:1px solid var(--borderL);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--soft);cursor:pointer;z-index:10}
.pane-area{flex:1;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.08) transparent}
.p{padding:36px 16px 16px;flex:1;display:flex;flex-direction:column}
.p-center{align-items:center;justify-content:center;text-align:center}
.shelf-xl{font-size:36px;font-weight:900;color:var(--shelf);line-height:1.1}
.shelf-md{font-size:20px;font-weight:700;color:var(--shelf)}
.name-md{font-size:16px;font-weight:700}
.qty-md{font-size:14px;font-weight:700;color:var(--accent)}
.divider{height:1px;background:var(--border);margin:8px 0}
.switch{width:38px;height:22px;border-radius:11px;background:var(--muted);position:relative;cursor:pointer;transition:background 0.2s;flex-shrink:0}
.switch.on{background:var(--red)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform 0.2s}
.switch.on::after{transform:translateX(16px)}
.input{width:100%;padding:10px 12px;border:1.5px solid var(--borderL);border-radius:10px;background:var(--card);color:var(--text);font-size:13px;font-family:inherit;outline:none}
.input:focus{border-color:var(--accent)}
.label{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px}
.btn-primary{padding:10px 16px;border-radius:10px;background:linear-gradient(135deg,#f09848,#e07028);color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-outline{padding:10px 16px;border-radius:10px;background:transparent;color:var(--accent);border:1.5px solid rgba(240,136,62,0.25);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.ph-area{display:none;flex-shrink:0;text-align:center;padding:16px 16px 12px;background:linear-gradient(135deg,#f09848,#e07028);cursor:pointer;user-select:none;position:relative;overflow:hidden}
.ph-area::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.08),transparent);pointer-events:none}
.ph-area .ph-active-emoji{font-size:24px;display:block;margin-bottom:4px}
.ph-area .ph-active-text{font-size:22px;font-weight:800;color:#fff;line-height:1.2;text-shadow:0 1px 4px rgba(0,0,0,0.2)}
.ph-area .ph-area-hint{font-size:9px;color:rgba(255,255,255,0.5);margin-top:6px}
.ph-area.ph-visible{display:block;animation:phSlideIn 0.3s ease-out}
@keyframes phSlideIn{from{max-height:0;padding-top:0;padding-bottom:0;opacity:0}to{max-height:200px;opacity:1}}
</style>
</head>
<body>
<div class="app">
<div class="controls">
<h1>🧪 Item Detail Lab</h1>
<div class="sub">Elige una version de cada panel. El sidebar se actualiza en vivo.</div>
<div class="ctrl-section" id="ctrlShow"><div class="ctrl-label"><span class="cl-icon">📱</span> Mostrar en tienda <span class="cl-active" id="showActive">v1</span></div><div class="ctrl-grid" id="showGrid"></div><div class="ctrl-desc" id="showDesc"></div></div>
<div class="ctrl-section" id="ctrlEdit"><div class="ctrl-label"><span class="cl-icon">✏️</span> Editar item <span class="cl-active" id="editActive">v1</span></div><div class="ctrl-grid" id="editGrid"></div><div class="ctrl-desc" id="editDesc"></div></div>
<div class="ctrl-section" id="ctrlPrice"><div class="ctrl-label"><span class="cl-icon">💰</span> Historial de precios <span class="cl-active" id="priceActive">v1</span></div><div class="ctrl-grid" id="priceGrid"></div><div class="ctrl-desc" id="priceDesc"></div></div>
<div class="ctrl-section" id="ctrlTrans"><div class="ctrl-label"><span class="cl-icon">🌍</span> Traducciones <span class="cl-active" id="transActive">v1</span></div><div class="ctrl-grid" id="transGrid"></div><div class="ctrl-desc" id="transDesc"></div></div>
<div class="ctrl-section" id="ctrlStats"><div class="ctrl-label"><span class="cl-icon">📊</span> Estadisticas <span class="cl-active" id="statsActive">v1</span></div><div class="ctrl-grid" id="statsGrid"></div><div class="ctrl-desc" id="statsDesc"></div></div>
<div class="ctrl-section" id="ctrlComm"><div class="ctrl-label"><span class="cl-icon">💬</span> Comentarios <span class="cl-active" id="commActive">v1</span></div><div class="ctrl-grid" id="commGrid"></div><div class="ctrl-desc" id="commDesc"></div></div>
<div class="ctrl-section" id="ctrlHist"><div class="ctrl-label"><span class="cl-icon">📋</span> Historial <span class="cl-active" id="histActive">v1</span></div><div class="ctrl-grid" id="histGrid"></div><div class="ctrl-desc" id="histDesc"></div></div>
</div>
<div class="phone-wrap">
<div class="phone">
<div class="phone-notch"></div>
<div class="tabs">
<button class="tab active" data-tab="show" onclick="switchTab('show')">📱</button>
<button class="tab" data-tab="edit" onclick="switchTab('edit')">✏️</button>
<button class="tab" data-tab="price" onclick="switchTab('price')">💰</button>
<button class="tab" data-tab="trans" onclick="switchTab('trans')">🌍</button>
<button class="tab" data-tab="stats" onclick="switchTab('stats')">📊</button>
<button class="tab" data-tab="comm" onclick="switchTab('comm')">💬</button>
<button class="tab" data-tab="hist" onclick="switchTab('hist')">📋</button>
<div class="tab-spacer"></div>
<button class="tab" data-tab="del" onclick="switchTab('del')" style="color:var(--red)">🗑</button>
</div>
<div class="content">
<div class="content-close">✕</div>
<div class="pane-area" id="paneArea"></div>
</div>
</div>
</div>
</div>
<script>
const STORAGE_KEY='babelcart_item_detail_lab_v1';
function loadSaved(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch{return{}}}
function syncToStorage(s){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}catch{}try{window.parent.postMessage({type:'lab_selection_changed',payload:s},'*')}catch{}}

const D={emoji:'🥛',name:'Mleko',shelf:'Leche',qty:'2',unit:'L',note:'pelne, nie light',cat:'dairy',catName:'Lacteos',catEmoji:'🥛',imp:true,by:'Manu',byFlag:'🇪🇸',time:'hace 2h',
langs:[{f:'🇵🇱',w:'Mleko',type:'yours'},{f:'🇪🇸',w:'Leche',type:'shelf'},{f:'🇬🇧',w:'Milk',type:'other'},{f:'🇩🇪',w:'Milch',type:'other'},{f:'🇫🇷',w:'Lait',type:'other'},{f:'🇮🇹',w:'Latte',type:'other'},{f:'🇵🇹',w:'Leite',type:'other'}]};

const PH=[{e:'🔍',t:'Donde puedo encontrar esto?'},{e:'❓',t:'Tienen esto?'},{e:'🔄',t:'Hay algo parecido?'},{e:'📦',t:'Esta agotado?'},{e:'🏪',t:'Hay mas en el almacen?'},{e:'🥜',t:'Tiene gluten?'},{e:'🥛',t:'Tiene lactosa?'},{e:'🌱',t:'Es vegano?'},{e:'💰',t:'Cuanto cuesta?'},{e:'🔪',t:'Puede cortarlo?'},{e:'👆',t:'Este, por favor'},{e:'🙏',t:'Gracias!'}];

function showInit(pane){
  const wrap=typeof pane==='string'?document.querySelector(pane):pane;if(!wrap)return;
  const area=wrap.querySelector('.ph-area'),areaText=wrap.querySelector('.ph-active-text'),areaEmoji=wrap.querySelector('.ph-active-emoji');
  wrap.querySelectorAll('.ph-item').forEach(el=>{el.addEventListener('click',()=>{if(areaText)areaText.textContent=el.dataset.phrase;if(areaEmoji)areaEmoji.textContent=el.dataset.emoji;if(area){area.classList.add('ph-visible');area.style.animation='none';void area.offsetHeight;area.style.animation=''}const list=wrap.querySelector('.ph-list'),toggle=wrap.querySelector('.ph-toggle');if(list)list.style.display='none';if(toggle){toggle.dataset.open='0';toggle.querySelector('.ph-arrow').textContent='▼'}})});
  if(area)area.addEventListener('click',()=>{area.classList.remove('ph-visible');if(areaText)areaText.textContent='';if(areaEmoji)areaEmoji.textContent=''});
  const toggle=wrap.querySelector('.ph-toggle');if(toggle)toggle.addEventListener('click',()=>{const list=wrap.querySelector('.ph-list'),open=toggle.dataset.open==='1';if(list)list.style.display=open?'none':'block';toggle.dataset.open=open?'0':'1';toggle.querySelector('.ph-arrow').textContent=open?'▼':'▲'});
}

const phListHTML=PH.map(p=>'<div class="ph-item" data-phrase="'+p.t+'" data-emoji="'+p.e+'" style="display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;transition:background 0.12s;border-bottom:1px solid var(--border)" onmouseover="this.style.background=\'rgba(255,255,255,0.03)\'" onmouseout="this.style.background=\'\'"><span style="font-size:18px">'+p.e+'</span><span style="font-size:13px;font-weight:600;color:var(--soft)">'+p.t+'</span></div>').join('');

const mkShow=(ns,es,ts,bb,lb)=>'<div class="p" style="gap:0;'+(bb||'')+'"><div class="ph-area"><span class="ph-active-emoji"></span><div class="ph-active-text"></div><div class="ph-area-hint">tap para ocultar</div></div><div style="text-align:center;padding:2px 16px 0;flex-shrink:0"><div style="'+ns.shelf+'">'+D.shelf+'</div><div style="'+ns.mine+'">('+D.name+')</div></div><div style="flex:1;display:flex;align-items:center;justify-content:center;'+(es.wrap||'')+'"><div style="'+es.inner+'">'+D.emoji+'</div></div><div style="flex-shrink:0;'+(ts.wrap||'')+'"><div class="ph-toggle" data-open="0" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;cursor:pointer;'+ts.bar+'"><span style="'+ts.label+'">Preguntas para el dependiente</span><span class="ph-arrow" style="'+ts.arrow+'">▼</span></div><div class="ph-list" style="display:none;max-height:260px;overflow-y:auto;'+(lb||'')+'">'+phListHTML+'</div></div></div>';

const SHOW=[
{n:'Clean Standard',d:'Espaciado equilibrado',h:mkShow({shelf:'font-size:32px;font-weight:900;color:var(--shelf);margin-top:10px',mine:'font-size:13px;color:var(--muted);margin-top:4px'},{inner:'font-size:72px'},{bar:'border-top:1px solid var(--border)',label:'font-size:11px;font-weight:700;color:var(--muted)',arrow:'font-size:10px;color:var(--muted)'},'','')},
{n:'Soft Glow',d:'Emoji con drop shadow',h:mkShow({shelf:'font-size:30px;font-weight:900;color:var(--shelf);margin-top:10px',mine:'font-size:12px;color:var(--muted);margin-top:4px'},{inner:'font-size:68px;filter:drop-shadow(0 6px 20px rgba(0,0,0,0.4))'},{wrap:'padding:0 12px 8px',bar:'background:var(--card);border-radius:12px;border:1px solid var(--borderL)',label:'font-size:11px;font-weight:700;color:var(--soft)',arrow:'font-size:10px;color:var(--muted)'},'','border-radius:0 0 12px 12px;border:1px solid var(--borderL);margin:0 12px')},
{n:'Minimal Line',d:'Tipografia fina, maximo aire',h:mkShow({shelf:'font-size:34px;font-weight:800;color:var(--shelf);margin-top:14px;letter-spacing:-1px',mine:'font-size:13px;color:var(--muted);margin-top:6px;font-weight:300'},{inner:'font-size:64px;opacity:0.9'},{bar:'border-top:1px solid rgba(255,255,255,0.04)',label:'font-size:10px;font-weight:600;color:var(--muted);letter-spacing:0.05em',arrow:'font-size:9px;color:var(--muted)'},'','')},
{n:'Bold Impact',d:'Shelf name enorme, emoji sutil',h:mkShow({shelf:'font-size:38px;font-weight:900;color:var(--shelf);margin-top:10px;letter-spacing:-1px',mine:'font-size:12px;color:var(--muted);margin-top:4px'},{inner:'font-size:80px;opacity:0.2',wrap:'position:relative'},{bar:'border-top:2px solid var(--accent)',label:'font-size:12px;font-weight:800;color:var(--accent)',arrow:'font-size:11px;color:var(--accent)'},'','')},
{n:'Card Elevated',d:'Todo dentro de card',h:mkShow({shelf:'font-size:28px;font-weight:900;color:var(--shelf);margin-top:10px',mine:'font-size:12px;color:var(--muted);margin-top:4px'},{inner:'font-size:64px'},{wrap:'margin:0 8px 8px',bar:'background:var(--card);border-radius:12px;border:1px solid var(--borderL)',label:'font-size:11px;font-weight:700;color:var(--soft)',arrow:'font-size:10px;color:var(--muted)'},'background:var(--card);margin:36px 8px 0;border-radius:16px;border:1px solid var(--borderL);overflow:hidden','')},
{n:'Shelf Spotlight',d:'Fondo negro, glow dorado',h:mkShow({shelf:'font-size:34px;font-weight:900;color:var(--shelf);margin-top:10px;text-shadow:0 0 24px rgba(232,195,100,0.2)',mine:'font-size:12px;color:rgba(255,255,255,0.2);margin-top:6px'},{inner:'font-size:68px;filter:drop-shadow(0 0 16px rgba(232,195,100,0.15))'},{bar:'border-top:1px solid rgba(232,195,100,0.1)',label:'font-size:11px;font-weight:700;color:rgba(232,195,100,0.4)',arrow:'font-size:10px;color:rgba(232,195,100,0.4)'},'background:#060608','')},
{n:'Rounded Bubble',d:'Nombres en pildoras',h:mkShow({shelf:'font-size:28px;font-weight:900;color:var(--shelf);margin-top:12px',mine:'font-size:11px;color:var(--muted);margin-top:6px;padding:4px 12px;background:var(--card);border-radius:8px;display:inline-block'},{inner:'font-size:72px'},{wrap:'padding:0 12px 8px',bar:'background:var(--card);border-radius:20px;border:1px solid var(--borderL)',label:'font-size:11px;font-weight:700;color:var(--soft)',arrow:'font-size:10px;color:var(--muted)'},'','border-radius:16px;margin:0 12px;border:1px solid var(--borderL);overflow:hidden')},
{n:'Split Accent',d:'Diseno editorial',h:mkShow({shelf:'font-size:32px;font-weight:900;color:var(--shelf);margin-top:10px',mine:'font-size:12px;color:var(--muted);margin-top:4px'},{inner:'font-size:72px'},{bar:'border-top:1px solid var(--border)',label:'font-size:11px;font-weight:700;color:var(--muted)',arrow:'font-size:10px;color:var(--muted)'},'','')},
{n:'Compact Dense',d:'Todo apretado, mas espacio para frases',h:mkShow({shelf:'font-size:24px;font-weight:900;color:var(--shelf);margin-top:6px',mine:'font-size:11px;color:var(--muted);margin-top:2px'},{inner:'font-size:52px'},{bar:'border-top:1px solid var(--border);padding:10px',label:'font-size:10px;font-weight:700;color:var(--muted)',arrow:'font-size:9px;color:var(--muted)'},'','')},
{n:'Gradient Warm',d:'Gradiente calido de fondo',h:mkShow({shelf:'font-size:32px;font-weight:900;color:var(--shelf);margin-top:10px',mine:'font-size:12px;color:var(--muted);margin-top:4px'},{inner:'font-size:72px;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.3))'},{wrap:'background:var(--card);border-radius:14px 14px 0 0;border-top:1px solid var(--borderL)',bar:'',label:'font-size:11px;font-weight:700;color:var(--soft)',arrow:'font-size:10px;color:var(--muted)'},'background:radial-gradient(ellipse at top,rgba(240,136,62,0.06),transparent 60%)','')},
];
const editHeader='<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span style="font-size:28px">'+D.emoji+'</span><input class="input" style="flex:1;font-size:16px;font-weight:700;padding:6px 10px" value="'+D.name+'"></div><button style="width:100%;padding:8px 0;border-radius:10px;background:transparent;border:1.5px solid var(--borderL);color:var(--soft);font-size:12px;cursor:pointer;font-family:inherit;margin-bottom:6px">🔗 Añadir URL de foto</button>';
const EDIT=[
{n:'Classic Form',d:'Labels + inputs apilados',h:'<div class="p" style="gap:14px">'+editHeader+'<div><div class="label">Cantidad</div><div style="display:flex;gap:8px"><input class="input" style="width:70px;text-align:center" value="'+D.qty+'"><select class="input" style="flex:1"><option>—</option><option selected>L</option><option>kg</option><option>g</option></select></div></div><div><div class="label">Nota</div><input class="input" value="'+D.note+'"></div><div><div class="label">Prioridad</div><div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:11px;border:1.5px solid rgba(255,92,92,0.2);background:rgba(255,92,92,0.04);cursor:pointer"><span style="width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 6px rgba(255,92,92,0.4)"></span><span style="font-size:13px;font-weight:600;flex:1">Importante</span><span class="switch on"></span></div></div><div style="margin-top:auto"><button class="btn-primary" style="width:100%">💾 Guardar</button></div></div>'},
{n:'Stepper Buttons',d:'Botones +/- grandes',h:'<div class="p p-center" style="gap:12px">'+editHeader+'<div style="font-size:36px">'+D.emoji+'</div><div class="name-md">'+D.name+'</div><div style="display:flex;align-items:center;gap:14px;margin:12px 0"><button style="width:44px;height:44px;border-radius:50%;background:var(--card);border:2px solid var(--borderL);font-size:20px;color:var(--soft);cursor:pointer">−</button><div style="text-align:center"><span style="font-size:40px;font-weight:900;color:var(--accent)">'+D.qty+'</span><div style="font-size:11px;color:var(--soft)">litros</div></div><button style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#f09848,#e07028);border:none;font-size:20px;color:#fff;cursor:pointer">+</button></div><input class="input" value="'+D.note+'" placeholder="📝 Nota..." style="margin-top:8px"><button class="btn-primary" style="width:100%;margin-top:8px">💾 Guardar</button></div>'},

const DEL=[{n:'Confirmar borrado',d:'Advertencia centrada',h:'<div class="p p-center" style="gap:14px"><div style="width:64px;height:64px;border-radius:50%;background:rgba(255,92,92,0.08);border:1px solid rgba(255,92,92,0.15);display:flex;align-items:center;justify-content:center;font-size:28px">🗑</div><div style="font-size:17px;font-weight:800">Eliminar '+D.name+'?</div><div style="font-size:12px;color:var(--soft);text-align:center;line-height:1.4">Se eliminara de la lista para todos los miembros. Esta accion no se puede deshacer.</div><div style="display:flex;gap:8px;width:100%;margin-top:8px"><button onclick="switchTab(\'show\')" style="flex:1;padding:13px;border-radius:12px;background:var(--card);border:1px solid var(--borderL);color:var(--soft);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">Cancelar</button><button style="flex:1;padding:13px;border-radius:12px;background:var(--red);border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Eliminar</button></div></div>'}];
const saved=loadSaved();
const state={show:saved.show||0,edit:saved.edit||0,trans:saved.trans||0,hist:saved.hist||0,comm:saved.comm||0,price:saved.price||0,stats:saved.stats||0,del:0,tab:'show'};
const ALL={show:SHOW,edit:EDIT,trans:TRANS,hist:HIST,comm:COMM,price:PRICE,stats:STATS,del:DEL};

function renderControls(){
  ['show','edit','price','trans','stats','comm','hist'].forEach(key=>{
    const grid=document.getElementById(key+'Grid'),desc=document.getElementById(key+'Desc'),active=document.getElementById(key+'Active');
    const items=ALL[key];if(!grid||!items)return;
    grid.innerHTML=items.map((item,i)=>'<button class="ctrl-btn '+(state[key]===i?'active':'')+'" onclick="selectVersion(\''+key+'\','+i+')">'+(i+1)+'</button>').join('');
    desc.textContent=items[state[key]].n+' — '+items[state[key]].d;
    active.textContent='v'+(state[key]+1);
  });
}

function renderPane(){
  const key=state.tab,items=ALL[key];
  if(!items)return;
  document.getElementById('paneArea').innerHTML=items[state[key]].h;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===key));
  if(key==='show')showInit(document.getElementById('paneArea'));
}

function selectVersion(key,idx){
  state[key]=idx;
  renderControls();
  if(state.tab===key)renderPane();
  syncToStorage(state);
}

function switchTab(tab){
  state.tab=tab;
  renderPane();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
}

renderControls();
renderPane();
</script>
